# Short version of the Research Program block (full version on the Research page).
program:
  - pillar: "Poverty, inequality, and violence"
    text: "how firms and public policy shape opportunity in favelas and how violence reshapes multinational business."
  - pillar: "Climate change"
    text: "how firms and communities protect the Amazon rainforest and the oceans."
  - pillar: "Healthcare"
    text: "how technology and stakeholder management improve care in HIV/AIDS clinics in Africa, and how the Zika epidemic affected families across racial groups in Brazil."
