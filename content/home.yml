name_heading: "Leandro Simões Pongeluppe"
intro_heading: "Introduction"
intro: |-
  <p>Leandro "Leo" Pongeluppe is a socio-environmental impact specialist, an assistant professor of management at the Wharton School, University of Pennsylvania, and a Leonard J. Horwitz Faculty Scholar. Leo holds a PhD in Strategic Management from the Rotman School of Management, University of Toronto. His primary research interests are related to stakeholder management and socioeconomic development. Particularly, Leo is interested in understanding how organizations’ design and governance affect the achievement of the United Nations' <a href="https://sdgs.un.org/goals">Sustainable Development Goals (SDGs)</a>, such as poverty alleviation, environmental conservation, and healthcare. Leo uses mixed methods in his research, combining econometric causal inference methods with ethnographic techniques to analyze multifaceted problems related to socioeconomic development. His fieldwork spans the Brazilian favelas, the Amazon rainforest, and HIV/AIDS treatment clinics in Africa.</p>
  <p>Leo's research has been published in <i>Administrative Science Quarterly</i>, <i>Management Science</i>, <i>Strategic Management Journal</i>, the <i>Review of Economics and Statistics</i>, <i>Business Ethics Quarterly</i>, and <i>Academy of Management Discoveries</i>, among other outlets. His work has received the William F. Glueck Best Paper Award from the Academy of Management (2021), the Wiley Blackwell Outstanding Dissertation Award from the Strategic Management Division of the Academy of Management (2023), the <i>Administrative Science Quarterly</i> Dissertation Award (2025), and two Responsible Research in Management Awards from Responsible Research in Business and Management (RRBM), in the Macro and Micro Areas (both 2025). Leo serves on the editorial review boards of the <i>Academy of Management Journal</i>, <i>Organization Science</i>, <i>Strategic Entrepreneurship Journal</i>, <i>Strategic Management Journal</i>, and <i>Strategy Science</i>. At Wharton, he teaches Managing the Established Enterprise in the MBA program, for which he received the Wharton Teaching Excellence Award three times (2023-24, 2024-25, and 2025-26).</p>
  <p>Professionally, Leo co-founded and worked as a PMO at <a href="https://www.insper.edu.br/pt/pesquisa/centro-de-gestao-e-politicas-publicas/metricis">Insper Metricis</a>, a research group dedicated to evaluating projects' socio-environmental impact, where he remains a research associate. At Insper Metricis, Leo participated in the design of Brazil's first Social Impact Bond (SIB), in partnership with the São Paulo State Government, Sundfeld Attorneys, Social Finance-UK, International Finance Corporation (IFC), and Inter-American Development Bank (IDB). Leo also worked for about three years as an associate researcher at the Accenture Institute for High Performance, on projects related to inclusive innovation and public innovation in Brazil, China, Ghana, India, Mozambique, Nigeria, and South Africa.</p>

