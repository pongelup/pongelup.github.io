program:
  - pillar: "Poverty and inequality"
    text: "Who gains when organizations expand opportunity in Brazilian favelas and disadvantaged communities?"
  - pillar: "Climate change"
    text: "How can firms and communities protect the Amazon and the oceans while creating value?"
  - pillar: "Healthcare and security"
    text: "How do organizations reach underserved patients, and how does terrorism shape where multinationals operate?"
