selected_heading: "Selected Publications"
# Published papers only; the one-line takeaways come from Leo's seminar deck (2026-09-29).
selected:
  - citation: "Pongeluppe, L. S. (2024). <b>The Allegory of the Favela: The Multifaceted Effects of Socioeconomic Mobility.</b> <i>Administrative Science Quarterly</i>, 69(3): 619-654. ASQ Dissertation Award 2025."
    takeaway: "NGO programs can increase labor market outcomes, but climbing the economic ladder increases psychological distress."
    doi: "https://doi.org/10.1177/00018392241240469"
  - citation: "Derksen, L., McGahan, A. M., & Pongeluppe, L. S. (Forthcoming). <b>The Lifesaving Impact of Electronic Medical Records for HIV Patients.</b> <i>Review of Economics and Statistics</i>. Published online October 2025."
    takeaway: "Electronic medical record implementation increased the number of patients in care and reduced deaths by 28% after five years."
    doi: "https://doi.org/10.1162/rest.a.1617"
  - citation: "McGahan, A. M., & Pongeluppe, L. S. (2023). <b>There Is No Planet B: Aligning Stakeholder Interests to Preserve the Amazon Rainforest.</b> <i>Management Science</i>, 69(12): 7860-7881. William F. Glueck Best Paper Award."
    takeaway: "By sharing value with local communities, firms can create Coasean mechanisms that internalize environmental externalities."
    doi: "https://doi.org/10.1287/mnsc.2023.4884"
  - citation: "Pongeluppe, L. S. (2022). <b>The Favela Effect: Spatial Inequalities and Firm Strategies in Disadvantaged Urban Communities.</b> <i>Strategic Management Journal</i>, 43(13): 2777-2808."
    takeaway: "Spatial inequalities reinforce socioeconomic disparities, but stakeholder-oriented firms can moderate this effect."
    doi: "https://doi.org/10.1002/smj.3414"
  - citation: "Lazzarini, S. G., Boehe, D. M., Pongeluppe, L. S., & Cook, M. L. (2026). <b>The Normative Core of Relational Stakeholder Strategies: Explaining Open Buyer-Supplier Relations in the Context of the Amazon Rainforest.</b> <i>Business Ethics Quarterly</i>, 36(1): 69-111."
    takeaway: "Firms guided by a morally informed normative core can sustain open supplier relations with Amazon communities, even when competitors buy from them too."
    doi: "https://doi.org/10.1017/beq.2025.3"
