# Research Program: three pillar cards. Each card has an optional image on top (file in assets/img/;
# leave "" for none; optional credit: and credit_url: print a photo credit under it), a short paragraph, and a row of UN SDG icons. The icons are read from
# assets/img/sdg/sdg_NN.png (for example sdg_01.png) and shown only when the file exists.
# Working-paper results never go here; the papers themselves are listed below the cards.
program_heading: "Research Program"
program_intro: "My research is organized around three pillars, each tied to the United Nations <a href=\"https://sdgs.un.org/goals\">Sustainable Development Goals (SDGs)</a>."
program:
  - pillar: "Poverty, Inequality, and Violence"
    image: pillar-poverty-rocinha-gavea.jpg
    image_alt: "Aerial drone view of the border between the Rocinha favela and the Gávea neighborhood in Rio de Janeiro: dense rooftops on one side, houses with pools among trees on the other"
    credit: "Photo: Johnny Miller / Unequal Scenes"
    credit_url: "https://unequalscenes.com"
    text: "I study how firms, nonprofits, and governments shape opportunity in communities marked by poverty, inequality, and violence. Much of this work takes place in Brazilian favelas, where I combine fieldwork and interviews with field experiments and administrative data to understand how organizations operate in disadvantaged places and how residents respond. I also study how violence, from police interventions in favelas to terrorism around the world, shapes where and how organizations do business. Throughout, I focus on the stakeholders these organizations affect and on who gains or loses access to economic opportunity."
    sdgs: [1, 2, 5, 8, 11, 16]
  - pillar: "Climate Change"
    image: pillar-climate-altamira-agroforest.jpg
    image_alt: "Floor of a cacao agroforest near Altamira, Pará, in the Brazilian Amazon, with seedlings among fallen leaves and tree trunks behind"
    credit: "Photo: Leandro S. Pongeluppe"
    text: "I study how organizations and their stakeholders protect ecosystems while creating economic value for the communities that depend on them. In the Amazon rainforest, I work with firms, cooperatives, and local communities that manage forest and river resources, such as non-timber forest products and the pirarucu fish. I also study water and the oceans, including who promotes desalination technologies and what footprint desalination leaves on marine environments, as well as how a changing climate relates to violence worldwide. I pair satellite and other natural-science data with fieldwork to connect global patterns to the choices organizations make on the ground."
    sdgs: [6, 12, 13, 14, 15]
  - pillar: "Healthcare"
    # Previous photo (Zambia truck stop), kept in assets/img but no longer displayed: pillar-health-zambia-truckstop.jpg
    # Source: Baobab HT_Twitter Picture_03.jpeg (RESTAT EMR Malawi folder), names on the wall board pixelated (gallery3 L-a).
    image: pillar-health-malawi-emr-nurse.jpg
    image_alt: "A health worker in a face mask logs in to the National EMR touchscreen at an HIV clinic in Malawi, with a barcode scanner and label printer beside her"
    credit: "Photo: Abdullah Chilungu"
    text: "I study how organizations deliver healthcare to the people who are hardest to reach. In sub-Saharan Africa, I examine how technology, such as electronic medical records in HIV/AIDS clinics in Malawi, and the design of stakeholder partnerships, such as roadside clinics along transport corridors, shape the care patients receive. In Brazil, I study how the burden of the Zika epidemic was distributed across racial groups and how the health system responded. This work combines partnerships with clinics and NGOs, large administrative records, and qualitative fieldwork."
    sdgs: [3, 10, 17]

