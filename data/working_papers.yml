# Working papers on the Research page, grouped by the three research pillars.
# Within each pillar, papers are ordered by closeness to publication: second-round R&R, first-round R&R,
# submitted or under review, then working papers. The CV (sections/03c_working_papers.tex) keeps the full list;
# "Fifty Shades of Green" and "How Does ESG Matter for Firm Performance, Really?" are in the CV but not on the site.
# Leo's rule (2026-10-09): describe the setting, data, and approach only. NEVER results, findings, numbers,
# or effect directions.
#
# Fields per paper:
#   title, coauthors (sentence shown under the title; leave empty for sole-authored papers),
#   status (journal and round, small print), award (optional small print),
#   links (optional list of {url, label}),
#   description (two sentences: setting, data, approach; no results),
#   image (optional figure file in assets/img/; leave "" for none), image_alt, caption,
#   image_credit (optional; for example "Photo: Name", shown in small print right under the image),
#   image_class (optional; wp-fig-tall shows a tall figure narrower so it takes about the same space as the others).
#   Figures must not contain SDG icons (those appear only on the pillar cards).

heading: "Working Papers"

groups:
  - topic: "Poverty, Inequality, and Violence"
    papers:
      - title: "Not from Ipanema: Security Interventions and Organizational Life in Brazilian Favelas"
        coauthors: "in collaboration with Daphne Coelho, Aline Gatignon, and Sérgio Lazzarini."
        status: "First round at Organization Science."
        description: "We study the Pacifying Police Units (UPPs), a large-scale security program that the state of Rio de Janeiro rolled out across its favelas. Combining interviews with panel data on formal organizations and jobs, we compare favelas that received a UPP with favelas that did not."
        image: wp-upp-staggered-jobs.png
        image_alt: "Event-study plot of the log number of formal jobs in favelas before and after a UPP arrived, estimated with five staggered difference-in-differences estimators"
        caption: "The design: a staggered difference-in-differences event study of formal jobs in favelas around the arrival of a UPP, with five estimators."

      - title: "Grid-Cells, Terrorism, and Multinational Corporations"
        coauthors: "in collaboration with Leandro Nardi."
        status: "Submitted to Strategic Management Journal."
        description: "We map terrorist attacks and multinational subsidiaries onto a worldwide grid of one-degree cells observed every year for almost three decades. Using panel models with spatial corrections, we examine how attacks inside a cell and in its surroundings relate to where multinational corporations locate."
        image: wp-terrorism-gtd-map.png
        image_alt: "World map of one-degree grid cells shaded by the fraction of years from 1993 to 2020 with at least one terrorist attack, above a bar chart of the yearly number of attacks"
        caption: "The setting: one-degree grid cells worldwide, shaded by the fraction of years from 1993 to 2020 with at least one terrorist attack, and the yearly number of attacks."

      - title: "Internalizing and Emancipating: A Dialogical Theory of Stakeholder Governance"
        coauthors: ""
        status: "Working paper (desk edit at Academy of Management Review)."
        description: "This conceptual paper treats the organization as a nexus of relationships with the stakeholders it affects. Drawing on transaction cost economics, the capability approach, and Paulo Freire's pedagogy, it develops a theory of stakeholder governance built on two levers, internalizing externalities and emancipating stakeholders, connected through dialogue."
        image: wp-amr-lever2-emancipation.png
        image_alt: "Diagram of individual well-being against initial endowment, with a deprivation zone, a newly emancipated range, and an emancipation zone"
        caption: "The second lever: the deprivation zone and the emancipation zone of stakeholder governance."

      - title: "Did the #MeToo Movement Change the Face or the Picture of Corporate America?"
        coauthors: "in collaboration with Michelle A. Borges, Aldo Musacchio, Rodrigo Wagner, and Marcelo Orellana."
        status: "Working paper."
        description: "We study how large U.S. public companies portrayed and staffed their leadership before and after the #MeToo movement began in October 2017. We combine computer-vision analysis of the images in corporate reports with data on executives and boards in an event-study design."
        image: wp-metoo-event-images.png
        image_alt: "Event-study plot of the number of images of women and of men per corporate report, 2012 to 2022, with 2016 as the reference year"
        caption: "The design: an event study of the images of women and men in corporate reports, 2012 to 2022, with 2016 as the reference year."

  - topic: "Climate Change"
    papers:
      - title: "Leviathan as A Client: Public versus Private Promotion of Desalination Technologies to Address Water Scarcity"
        coauthors: "in collaboration with Ilze Kivleniece and Sérgio Lazzarini."
        status: "Second round at Strategic Management Journal."
        award: "Best Proposal Award, Strategic Management Society, Cooperative Strategies Interest Group, 2023."
        description: "We compare how public and private clients commission desalination plants and which technologies they choose to address water scarcity. Using global data on desalination plants since the 1950s together with historical drought data, we examine these choices across countries with different levels of institutional development."
        image: wp-desal1-public-private-map.png
        image_alt: "World map of countries shaded by the number of desalination plants with public and private clients, with a three-by-three color legend"
        caption: "The setting: countries shaded by the number of desalination plants built for public and for private clients."

      - title: "Multiple Stakeholders, One Purpose: Value Creation and Distribution by Protecting Biodiversity in the Amazon"
        coauthors: "in collaboration with Elis Regina Monte Feitosa and Maria Sylvia Macchione Saes."
        status: "Second round at Academy of Management Perspectives."
        description: "We study the community-based management of the pirarucu, a giant Amazonian fish, in two sustainable-use reserves in the Brazilian Amazon, the RDS Mamirauá and the RESEX Médio Juruá. Drawing on fieldwork with community associations and their partners, we examine how value is created and distributed among multiple stakeholders when protecting biodiversity is the shared purpose."
        # Cropped top and bottom from wp-pirarucu-fisher.jpg (kept in assets/img) so it is less tall.
        image: wp-pirarucu-fisher-wide.jpg
        image_alt: "A fisher carrying a large pirarucu on the shoulders along a forest path in the Brazilian Amazon, with a second fisher behind him"
        caption: "The setting: fishers carrying a pirarucu out of the floodplain in a sustainable-use reserve in the Brazilian Amazon."
        image_credit: "Photo: Elis Regina Feitosa"

      - title: "Global Footprint of Desalination in the Oceans"
        coauthors: "in collaboration with Xinni Wu, Ilze Kivleniece, Sérgio Lazzarini, and Hugo N. Ulloa."
        status: "Under review at Nature Sustainability."
        description: "We study the environmental footprint of desalination plants on the surrounding oceans worldwide. We link the locations and start dates of desalination plants to satellite measurements of ocean conditions, such as salinity, sea surface temperature, and chlorophyll, in a staggered difference-in-differences design."
        # Previous figure (point map of plant locations), kept in assets/img but no longer displayed: wp-desal2-plants-map.png
        # Triangle layout (a and b on top, c centered below) built from the paper's panel files
        # fig1_panelB/C/D_*.png; the earlier stacked version is kept in assets/img: wp-desal2-ocean-conditions-3panel.png
        image: wp-desal2-ocean-conditions-triangle.png
        image_alt: "Three world maps of ocean surface conditions, two on top and one centered below: (a) salinity in parts per thousand, (b) sea surface temperature in degrees Celsius, and (c) chlorophyll-a concentration in milligrams per cubic meter, each with its own color scale"
        caption: "The ocean conditions we track: global maps of (a) surface salinity, (b) sea surface temperature, and (c) chlorophyll-a concentration, 2015 Q4."

      - title: "The Influence of Climate Change on Terrorism"
        coauthors: "in collaboration with Leandro Nardi."
        status: "Working paper."
        description: "We combine a worldwide grid of one-degree cells with yearly measures of water balance, from drought to unusually wet conditions, and records of terrorist attacks over three decades. Using panel models with spatial corrections, we examine how climate conditions in a cell and in its neighborhood relate to terrorism."
        # Panels A and B of figure_26_projection.png (Analyses_LP\Grid Cells\Figures 3), cropped from the original (gallery2 G-a).
        image: wp-climate-terrorism-projection-ssp585-2041-2060.png
        image_alt: "Two world maps side by side for SSP5-8.5, 2041 to 2060: (A) projected change in December SPEI-12, in standard deviations of each cell's 1991-2020 distribution, brown for drier and green for wetter; (B) projected change in the annual probability of at least one terrorist attack, in percentage points, red for higher and blue for lower"
        caption: "Projected drought conditions (change in December SPEI-12) and predicted change in the probability of terrorist attacks under SSP5-8.5, 2041-2060, ensemble median of 16 CMIP6 models."

  - topic: "Healthcare"
    papers:
      - title: "Stakeholder Architecture under Resource Constraints: A Configurational Approach to Healthcare Provision in Sub-Saharan Africa"
        coauthors: "in collaboration with Aline Gatignon, Julien Clément, and Luk N. Van Wassenhove."
        status: "Working paper."
        description: "We study North Star Alliance, an NGO that runs roadside clinics offering HIV/AIDS and other health services to truck drivers and other high-risk populations along transport corridors in sub-Saharan Africa. Using qualitative and survey data from its clinics, we apply fuzzy-set qualitative comparative analysis (fsQCA) to compare the configurations of stakeholder relationships behind each clinic's healthcare delivery."
        image: wp-northstar-wellness-centre.jpg
        image_alt: "Ilula Mtua Wellness Centre, a blue North Star Alliance roadside clinic in Africa"
        caption: "The setting: a North Star Alliance roadside wellness centre."
        # Source: slide 9 of Webpage\Pictures and Covers\SDGs and Projects.pptx, noted there as "Picture from North Star
        # Alliance webpage." No EXIF or photographer name survives, so the credit goes to the organization.
        image_credit: "Photo: North Star Alliance"

      - title: "Who Bears the Epidemic?"
        coauthors: "in collaboration with Carlos Inoue."
        status: "Working paper."
        description: "We study the Zika epidemic in Brazil and how its burden was distributed across racial groups of mothers and newborns. Using national birth records in an event-study design, we compare white and Black or Brown mothers before and after the outbreak, and across public (SUS) and private care."
        image: wp-zika-map-and-cases.png
        image_alt: "Two panels: (a) map of Brazilian municipalities shaded by the microcephaly rate per 10,000 live births in 2016, with Pernambuco outlined; (b) bar chart of recorded Zika cases by epidemiological week, 2016 to 2019"
        caption: "The setting: (a) microcephaly rate per 10,000 live births by municipality, 2016, Pernambuco outlined (SINASC/DATASUS, ICD-10 Q02); (b) recorded Zika cases by epidemiological week, 2016 to 2019 (SINAN)."
